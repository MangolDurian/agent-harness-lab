<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Harness Debugger</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a1f3d;
  --ink-rgb: 10, 31, 61;
  --ink-tint: #152a4a;
  --paper: #f1f3f5;
  --paper-rgb: 241, 243, 245;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --sans: "Noto Sans SC", source-han-sans-sc, sans-serif;
  --tool-bash: #e6a817;
  --tool-read: #4a90d9;
  --tool-write: #3dae7a;
  --tool-todo: #9b59b6;
  --tool-delegate: #e07ba8;
  --tool-skill: #2db5b5;
  --tool-background: #e67e22;
  --tool-default: #8899aa;
  --team-working: #e74c3c;
  --team-idle: #2ecc71;
  --team-stopped: rgba(var(--paper-rgb), .25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--paper);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- Top Bar ---- */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 48px;
  min-height: 48px;
  background: rgba(var(--ink-rgb), .92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(var(--paper-rgb), .08);
  font-family: var(--mono);
  font-size: 13px;
}

.top-bar .title {
  font-weight: 600;
  letter-spacing: .03em;
  color: rgba(var(--paper-rgb), .9);
}

.top-bar .stats {
  display: flex;
  gap: 16px;
  color: rgba(var(--paper-rgb), .45);
  font-size: 12px;
}

.top-bar .stats .val {
  color: rgba(var(--paper-rgb), .75);
  font-weight: 500;
}

/* ---- Main Layout ---- */
.main-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ---- Todo Sidebar ---- */
.todo-panel {
  width: 240px;
  min-width: 240px;
  background: rgba(var(--ink-rgb), .6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid rgba(var(--paper-rgb), .06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.todo-header {
  padding: 16px 16px 12px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: rgba(var(--paper-rgb), .4);
  border-bottom: 1px solid rgba(var(--paper-rgb), .06);
}

.todo-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.todo-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 16px;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(var(--paper-rgb), .7);
  animation: fadeSlideIn .3s cubic-bezier(.22,1,.36,1) both;
}

.todo-item .icon {
  flex-shrink: 0;
  width: 18px;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 2px;
}

.todo-item.pending .icon { color: rgba(var(--paper-rgb), .3); }
.todo-item.in_progress .icon { color: var(--tool-todo); }
.todo-item.in_progress { color: rgba(var(--paper-rgb), .95); }
.todo-item.completed .icon { color: rgba(var(--paper-rgb), .25); }
.todo-item.completed { color: rgba(var(--paper-rgb), .35); text-decoration: line-through; }

.todo-empty {
  padding: 24px 16px;
  text-align: center;
  color: rgba(var(--paper-rgb), .25);
  font-size: 13px;
}

/* ---- Chat Panel ---- */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.msg {
  animation: fadeSlideIn .35s cubic-bezier(.22,1,.36,1) both;
  max-width: 100%;
}

.msg-user {
  align-self: flex-end;
  background: rgba(var(--paper-rgb), .1);
  border-radius: 12px 12px 4px 12px;
  padding: 10px 16px;
  max-width: 70%;
  font-size: 14px;
  color: rgba(var(--paper-rgb), .9);
}

.msg-assistant {
  align-self: flex-start;
  font-size: 14px;
  line-height: 1.7;
  color: rgba(var(--paper-rgb), .85);
  max-width: 85%;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg-assistant .label {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: rgba(var(--paper-rgb), .35);
  margin-bottom: 6px;
}

/* ---- Tool Cards ---- */
.tool-card {
  background: rgba(var(--paper-rgb), .04);
  border: 1px solid rgba(var(--paper-rgb), .06);
  border-left: 3px solid var(--tool-color, var(--tool-default));
  border-radius: 6px;
  padding: 10px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  max-width: 85%;
  align-self: flex-start;
  animation: fadeSlideIn .3s cubic-bezier(.22,1,.36,1) both;
}

.tool-card:hover {
  background: rgba(var(--paper-rgb), .08);
}

.tool-card.selected {
  background: rgba(var(--paper-rgb), .1);
  border-color: rgba(var(--paper-rgb), .15);
  border-left-color: var(--tool-color, var(--tool-default));
}

.tool-card .tool-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.tool-card .tool-name {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--tool-color, var(--tool-default));
  text-transform: uppercase;
  letter-spacing: .03em;
}

.tool-card .tool-args {
  font-size: 13px;
  color: rgba(var(--paper-rgb), .6);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-height: 40px;
}

.tool-card .tool-output-preview {
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(var(--paper-rgb), .35);
  margin-top: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-height: 20px;
}

/* Sub-agent cards: indented + semi-transparent */
.tool-card.sub-agent {
  margin-left: 24px;
  opacity: .75;
  border-left-style: dashed;
}

.tool-card.sub-agent .tool-name::before {
  content: "↳ ";
  opacity: .5;
}

/* Background badge */
.tool-card .bg-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--tool-background);
  background: rgba(230, 126, 34, .12);
  border-radius: 3px;
  padding: 1px 5px;
  margin-left: 6px;
  letter-spacing: .03em;
  vertical-align: middle;
}

/* Background completion notification in output */
.tool-card .bg-notification {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tool-background);
  background: rgba(230, 126, 34, .08);
  border-left: 2px solid var(--tool-background);
  border-radius: 3px;
  padding: 6px 10px;
  margin-bottom: 6px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Team message notification in output */
.tool-card .team-notification {
  font-family: var(--mono);
  font-size: 11px;
  color: #3498db;
  background: rgba(52, 152, 219, .08);
  border-left: 2px solid #3498db;
  border-radius: 3px;
  padding: 6px 10px;
  margin-bottom: 6px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* Message flow arrow for send/broadcast */
.tool-card .msg-flow {
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(var(--paper-rgb), .5);
  margin-top: 2px;
}
.tool-card .msg-flow .arrow { color: #3498db; margin: 0 4px; }

/* Teammate cards in sidebar */
.team-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  animation: fadeSlideIn .3s cubic-bezier(.22,1,.36,1) both;
}
.team-card .team-avatar {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  flex-shrink: 0; text-transform: uppercase;
  color: rgba(var(--paper-rgb), .9);
}
.team-card.working .team-avatar { background: var(--team-working); }
.team-card.idle .team-avatar { background: var(--team-idle); }
.team-card.stopped .team-avatar { background: var(--team-stopped); }
.team-card .team-info { flex: 1; min-width: 0; }
.team-card .team-name {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: rgba(var(--paper-rgb), .85);
}
.team-card .team-role { font-size: 11px; color: rgba(var(--paper-rgb), .4); }
.team-card .team-status-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.team-card.working .team-status-dot { background: var(--team-working); animation: pulse 1.5s ease-in-out infinite; }
.team-card.idle .team-status-dot { background: var(--team-idle); }
.team-card.stopped .team-status-dot { background: var(--team-stopped); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ---- Detail Panel ---- */
.detail-panel {
  width: 360px;
  min-width: 360px;
  background: rgba(var(--ink-rgb), .6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-left: 1px solid rgba(var(--paper-rgb), .06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.detail-header {
  padding: 16px 16px 12px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: rgba(var(--paper-rgb), .4);
  border-bottom: 1px solid rgba(var(--paper-rgb), .06);
}

.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.detail-empty {
  color: rgba(var(--paper-rgb), .2);
  font-size: 13px;
  text-align: center;
  padding-top: 40px;
}

.detail-section {
  margin-bottom: 16px;
}

.detail-section .detail-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: rgba(var(--paper-rgb), .35);
  margin-bottom: 6px;
}

.detail-section .detail-value {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  color: rgba(var(--paper-rgb), .8);
  white-space: pre-wrap;
  word-break: break-all;
  background: rgba(var(--paper-rgb), .04);
  border-radius: 4px;
  padding: 10px 12px;
  max-height: 400px;
  overflow-y: auto;
}

.detail-section .detail-value.args-view {
  white-space: pre-wrap;
}

/* ---- Bottom Bar ---- */
.bottom-bar {
  border-top: 1px solid rgba(var(--paper-rgb), .06);
  background: rgba(var(--ink-rgb), .92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.status-line {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 4px 20px;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(var(--paper-rgb), .3);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #e74c3c;
  transition: background .3s;
}

.status-dot.connected { background: #2ecc71; }

.input-row {
  display: flex;
  gap: 8px;
  padding: 8px 20px 12px;
}

.input-row input {
  flex: 1;
  background: rgba(var(--paper-rgb), .06);
  border: 1px solid rgba(var(--paper-rgb), .1);
  border-radius: 8px;
  padding: 10px 16px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--paper);
  outline: none;
  transition: border-color .2s;
}

.input-row input:focus {
  border-color: rgba(var(--paper-rgb), .25);
}

.input-row input::placeholder {
  color: rgba(var(--paper-rgb), .25);
}

.input-row button {
  background: rgba(var(--paper-rgb), .1);
  border: 1px solid rgba(var(--paper-rgb), .12);
  border-radius: 8px;
  padding: 10px 20px;
  font-family: var(--mono);
  font-size: 13px;
  color: rgba(var(--paper-rgb), .8);
  cursor: pointer;
  transition: background .15s;
}

.input-row button:hover {
  background: rgba(var(--paper-rgb), .16);
}

.input-row button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

/* ---- Processing Indicator ---- */
.processing-bar {
  height: 2px;
  background: transparent;
  transition: background .3s;
  overflow: hidden;
}

.processing-bar.active {
  background: rgba(var(--paper-rgb), .06);
}

.processing-bar.active::after {
  content: "";
  display: block;
  height: 100%;
  width: 30%;
  background: linear-gradient(90deg, transparent, rgba(var(--paper-rgb), .3), transparent);
  animation: processingSlide 1.2s ease-in-out infinite;
}

/* ---- Queued messages (输入排队) ---- */
.queued-row {
  display: none;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
}
.queued-row.active { display: flex; }
.queued-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(var(--paper-rgb), .06);
  border: 1px solid rgba(var(--paper-rgb), .12);
  border-radius: 6px;
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(var(--paper-rgb), .65);
}
.queued-pill .queued-tag { color: #e67e22; flex-shrink: 0; }
.queued-pill .queued-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.queued-pill .queued-cancel {
  cursor: pointer;
  color: rgba(var(--paper-rgb), .4);
  flex-shrink: 0;
}
.queued-pill .queued-cancel:hover { color: rgba(var(--paper-rgb), .8); }

/* ---- Scrollbar ---- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(var(--paper-rgb), .12); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(var(--paper-rgb), .2); }

/* ---- Animations ---- */
@keyframes fadeSlideIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes processingSlide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="title">Agent Harness Debugger <select id="stage-select" style="opacity:.7;font-weight:400;margin-left:8px;font-family:inherit;font-size:inherit;background:transparent;color:inherit;border:1px solid rgba(var(--paper-rgb),.15);border-radius:4px;padding:2px 6px;cursor:pointer;outline:none"></select></div>
  <div class="stats">
    <span>turns <span class="val" id="stat-turns">0</span></span>
    <span>tools <span class="val" id="stat-tools">0</span></span>
  </div>
</div>

<!-- Main Area -->
<div class="main-area">
  <!-- Todo Sidebar -->
  <div class="todo-panel">
    <div class="todo-header" id="sidebar-header">TODO</div>
    <div class="todo-list" id="todo-list">
      <div class="todo-empty" id="todo-empty">no tasks yet</div>
    </div>
    <!-- Team section (s09 only, hidden by default) -->
    <div id="team-section" style="display:none; border-top: 1px solid rgba(var(--paper-rgb),.06);">
      <div class="todo-header">TEAM</div>
      <div id="team-list">
        <div class="todo-empty" id="team-empty">no teammates</div>
      </div>
    </div>
  </div>

  <!-- Chat Panel -->
  <div class="chat-panel">
    <div class="processing-bar" id="processing-bar"></div>
    <div class="chat-messages" id="chat-messages"></div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-panel">
    <div class="detail-header">TOOL DETAIL</div>
    <div class="detail-content" id="detail-content">
      <div class="detail-empty">click a tool card to inspect</div>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="status-line">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">disconnected</span>
    <span id="status-msgs">0 msgs</span>
    <span id="status-tool-calls">0 tool calls</span>
  </div>
  <div class="queued-row" id="queued-row"></div>
  <div class="input-row">
    <input type="text" id="input" placeholder="type a message..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
// ---- State ----
let ws = null;
let toolCallCount = 0;
let turnCount = 0;
let msgCount = 0;
let isProcessing = false;
let selectedCard = null;
let userScrolled = false;
// 处理中输入的消息排队，本轮结束后按顺序自动发出
let pendingQueue = [];
// Track delegate nesting: when a delegate tool_call comes, subsequent sub_tool_calls
// belong to it until the next non-sub event or processing_end
let currentDelegateEl = null;
// s09 team state: { name: { role, status } }
let teamState = {};
let currentStage = "";

const chatEl = document.getElementById("chat-messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const processingBar = document.getElementById("processing-bar");
const todoListEl = document.getElementById("todo-list");
const todoEmptyEl = document.getElementById("todo-empty");
const detailEl = document.getElementById("detail-content");
const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");
const statusMsgs = document.getElementById("status-msgs");
const statusToolCalls = document.getElementById("status-tool-calls");
const statTurns = document.getElementById("stat-turns");
const statTools = document.getElementById("stat-tools");
const stageSelect = document.getElementById("stage-select");
const sidebarHeader = document.getElementById("sidebar-header");
const queuedRow = document.getElementById("queued-row");
const teamSection = document.getElementById("team-section");
const teamListEl = document.getElementById("team-list");

// ---- Tool color mapping ----
const TOOL_COLORS = {
  bash: "var(--tool-bash)",
  read_file: "var(--tool-read)",
  write_file: "var(--tool-write)",
  todo_write: "var(--tool-todo)",
  task_create: "#9b59b6",
  task_update: "#8e44ad",
  task_list: "#7d3c98",
  delegate: "var(--tool-delegate)",
  load_skill: "var(--tool-skill)",
  compact: "#e67e22",
  background_status: "var(--tool-background)",
  spawn: "#e74c3c",
  send: "#3498db",
  broadcast: "#1abc9c",
  team_status: "#9b59b6",
};

// ---- WebSocket ----
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    statusDot.classList.add("connected");
    statusText.textContent = "connected";
  };

  ws.onclose = () => {
    statusDot.classList.remove("connected");
    statusText.textContent = "disconnected";
    // 断连后后端会以全新的空 messages 重连，清掉处理态和排队，避免把跟进消息发进新上下文
    isProcessing = false;
    processingBar.classList.remove("active");
    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
    inputEl.placeholder = "type a message...";
    pendingQueue = [];
    renderQueue();
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {};

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleEvent(data);
  };
}

// ---- Send ----
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  // 处理中：不丢弃也不阻塞，先排队，本轮结束自动发出
  if (isProcessing) {
    pendingQueue.push(text);
    inputEl.value = "";
    renderQueue();
    return;
  }
  ws.send(JSON.stringify({ type: "user_message", content: text }));
  inputEl.value = "";
  appendUserMsg(text);
  msgCount++;
  updateStatus();
}

// 渲染排队中的消息提示条
function renderQueue() {
  queuedRow.innerHTML = "";
  if (pendingQueue.length === 0) {
    queuedRow.classList.remove("active");
    return;
  }
  queuedRow.classList.add("active");
  pendingQueue.forEach((text, i) => {
    const pill = document.createElement("div");
    pill.className = "queued-pill";
    pill.innerHTML =
      '<span class="queued-tag">QUEUED</span>' +
      '<span class="queued-text"></span>' +
      '<span class="queued-cancel" title="cancel">x</span>';
    pill.querySelector(".queued-text").textContent = text;
    pill.querySelector(".queued-cancel").addEventListener("click", () => {
      pendingQueue.splice(i, 1);
      renderQueue();
    });
    queuedRow.appendChild(pill);
  });
}

// 本轮处理结束后，按 FIFO 发出一条排队消息（发出后会再触发 processing_start）
function flushQueue() {
  if (isProcessing || pendingQueue.length === 0) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const text = pendingQueue.shift();
  renderQueue();
  ws.send(JSON.stringify({ type: "user_message", content: text }));
  appendUserMsg(text);
  msgCount++;
  updateStatus();
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ---- Scroll tracking ----
chatEl.addEventListener("scroll", () => {
  const atBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 40;
  userScrolled = !atBottom;
});

function scrollToBottom() {
  if (!userScrolled) {
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

// ---- Event handling ----
function handleEvent(data) {
  switch (data.type) {
    case "processing_start":
      isProcessing = true;
      processingBar.classList.add("active");
      // 不再禁用输入：处理中允许继续输入，消息会排队
      sendBtn.textContent = "Queue";
      inputEl.placeholder = "processing… type to queue a follow-up";
      currentDelegateEl = null;
      break;

    case "tool_call":
      toolCallCount++;
      appendToolCard(data, false);
      if (data.todo_state) updateTodo(data.todo_state);
      if (data.task_state) updateTodoText(data.task_state);
      // s09: update team state from tool output
      if (data.name === "spawn" && data.args) {
        teamState[data.args.name] = { role: data.args.role, status: "working" };
        renderTeam();
      }
      if (data.name === "team_status" && data.output) {
        updateTeamFromStatus(data.output);
      }
      scrollToBottom();
      break;

    case "sub_tool_call":
      appendToolCard(data, true);
      scrollToBottom();
      break;

    case "processing_end":
      isProcessing = false;
      processingBar.classList.remove("active");
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      inputEl.placeholder = "type a message...";
      turnCount = data.turn_count || turnCount;
      if (data.assistant_text) {
        appendAssistantMsg(data.assistant_text);
        msgCount++;
      }
      currentDelegateEl = null;
      updateStatus();
      scrollToBottom();
      // 本轮结束，自动发出一条排队消息（会再触发 processing_start）
      flushQueue();
      break;

    case "stage_switched":
      stageSelect.value = data.stage;
      currentStage = data.stage;
      chatEl.innerHTML = "";
      toolCallCount = 0;
      turnCount = 0;
      msgCount = 0;
      userScrolled = false;
      currentDelegateEl = null;
      selectedCard = null;
      pendingQueue = [];
      renderQueue();
      detailEl.innerHTML = '<div class="detail-empty">click a tool card to inspect</div>';
      sidebarHeader.textContent = (data.stage === "s07" || data.stage === "s08" || data.stage === "s09") ? "TASKS" : "TODO";
      if (data.task_state) {
        updateTodoText(data.task_state);
      } else {
        todoListEl.innerHTML = '<div class="todo-empty">no tasks yet</div>';
      }
      // s09: show/hide team section
      teamState = {};
      renderTeam();
      teamSection.style.display = (data.stage === "s09") ? "" : "none";
      appendSystemMsg("Switched to " + data.tag);
      updateStatus();
      break;

    case "error":
      isProcessing = false;
      processingBar.classList.remove("active");
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      inputEl.placeholder = "type a message...";
      appendErrorMsg(data.message || "unknown error");
      scrollToBottom();
      flushQueue();
      break;

    case "system_message":
      appendSystemMsg(data.text || "");
      scrollToBottom();
      break;
  }
  updateStatus();
}

// ---- DOM helpers ----
function appendUserMsg(text) {
  const el = document.createElement("div");
  el.className = "msg msg-user";
  el.textContent = text;
  chatEl.appendChild(el);
  scrollToBottom();
}

function appendAssistantMsg(text) {
  const el = document.createElement("div");
  el.className = "msg msg-assistant";
  el.innerHTML = '<div class="label">assistant</div>' + escapeHtml(text);
  chatEl.appendChild(el);
}

function appendErrorMsg(text) {
  const el = document.createElement("div");
  el.className = "msg msg-user";
  el.style.background = "rgba(231,76,60,.15)";
  el.textContent = "Error: " + text;
  chatEl.appendChild(el);
}

function appendSystemMsg(text) {
  const el = document.createElement("div");
  el.className = "msg msg-user";
  el.style.background = "rgba(var(--paper-rgb),.06)";
  el.style.color = "rgba(var(--paper-rgb),.45)";
  el.style.fontSize = "12px";
  el.style.fontFamily = "var(--mono)";
  el.textContent = text;
  chatEl.appendChild(el);
  scrollToBottom();
}

function appendToolCard(data, isSub) {
  const el = document.createElement("div");
  const color = TOOL_COLORS[data.name] || "var(--tool-default)";
  el.className = "tool-card" + (isSub ? " sub-agent" : "");
  el.style.setProperty("--tool-color", color);

  const argsPreview = formatArgsPreview(data.name, data.args);
  const outputRaw = data.output || "";

  // Detect background notification in output: "[后台任务 bg_N ...]"
  const bgMatch = outputRaw.match(/^\[后台任务 bg_(\d+) (完成|失败)\]([^\n]*)\n([\s\S]*)/);
  let bgNotifHtml = "";
  let remainingOutput = outputRaw;
  if (bgMatch) {
    const notifText = bgMatch[0].split("\n\n")[0];
    remainingOutput = outputRaw.slice(notifText.length).replace(/^\n+/, "");
    bgNotifHtml = '<div class="bg-notification">' + escapeHtml(notifText) + '</div>';
  }

  // Detect team message notification in output: "[队友消息]"
  let teamNotifHtml = "";
  const teamMatch = remainingOutput.match(/\[队友消息\]\n([\s\S]*)/);
  if (teamMatch) {
    const teamMsgText = "[队友消息]\n" + teamMatch[1].trim();
    remainingOutput = remainingOutput.slice(0, remainingOutput.indexOf("[队友消息]")).replace(/\n+$/, "");
    teamNotifHtml = '<div class="team-notification">' + escapeHtml(truncate(teamMsgText, 200)) + '</div>';
  }

  const outputPreview = truncate(remainingOutput, 80);

  // Message flow for send/broadcast
  let msgFlowHtml = "";
  if (data.name === "send" && data.args) {
    msgFlowHtml = '<div class="msg-flow">lead <span class="arrow">\u2192</span> ' + escapeHtml(data.args.to || "?") + '</div>';
  } else if (data.name === "broadcast" && data.args) {
    const names = Object.keys(teamState).filter(n => teamState[n]);
    msgFlowHtml = '<div class="msg-flow">lead <span class="arrow">\u2192</span> ' + escapeHtml(names.join(", ") || "all") + '</div>';
  }

  el.innerHTML =
    '<div class="tool-header">' +
      '<span class="tool-name">' + escapeHtml(data.name) + '</span>' +
      (data.background_start ? '<span class="bg-badge">BG</span>' : '') +
    '</div>' +
    (argsPreview ? '<div class="tool-args">' + escapeHtml(argsPreview) + '</div>' : '') +
    msgFlowHtml +
    bgNotifHtml +
    teamNotifHtml +
    (outputPreview ? '<div class="tool-output-preview">' + escapeHtml(outputPreview) + '</div>' : '');

  el.dataset.toolData = JSON.stringify(data);

  el.addEventListener("click", () => {
    if (selectedCard) selectedCard.classList.remove("selected");
    el.classList.add("selected");
    selectedCard = el;
    showDetail(data);
  });

  // If this is a delegate card, track it as container for sub_tool_calls
  if (data.name === "delegate" && !isSub) {
    currentDelegateEl = el;
    chatEl.appendChild(el);
    return;
  }

  // Sub-agent calls nest under the delegate card visually
  if (isSub && currentDelegateEl) {
    currentDelegateEl.after(el);
    return;
  }

  chatEl.appendChild(el);
}

function formatArgsPreview(name, args) {
  if (!args) return "";
  switch (name) {
    case "bash": return "$ " + (args.command || "") + (args.run_in_background ? " [bg]" : "");
    case "read_file": return args.file_path || "";
    case "write_file": return (args.file_path || "") + " (" + ((args.content || "").split("\n").length) + " lines)";
    case "todo_write": {
      const items = args.items || [];
      return items.length + " items";
    }
    case "task_create": {
      const tasks = args.tasks || [];
      return tasks.length + " tasks created";
    }
    case "task_update": {
      const updates = args.updates || [];
      return updates.map(u => "#" + (u.id || "?") + (u.status ? "→" + u.status : "")).join(", ");
    }
    case "task_list": {
      return args.status ? "filter: " + args.status : "all tasks";
    }
    case "delegate": return truncate(args.task || "", 80);
    case "load_skill": return args.name || "";
    case "compact": return "compress context";
    case "background_status": return "check background tasks";
    case "spawn": return (args.name || "?") + " (" + (args.role || "?") + ")";
    case "send": return "→ " + (args.to || "?") + ": " + truncate(args.content || "", 40);
    case "broadcast": return truncate(args.content || "", 60);
    case "team_status": return "check team status";
    default: return JSON.stringify(args).slice(0, 80);
  }
}

function showDetail(data) {
  const color = TOOL_COLORS[data.name] || "var(--tool-default)";
  let html = '';

  html += '<div class="detail-section">';
  html += '<div class="detail-label">Tool</div>';
  html += '<div class="detail-value" style="color:' + color + ';font-weight:500">' + escapeHtml(data.name) + '</div>';
  html += '</div>';

  if (data.background_start) {
    html += '<div class="detail-section">';
    html += '<div class="detail-label">Mode</div>';
    html += '<div class="detail-value" style="color:var(--tool-background);font-weight:500">background</div>';
    html += '</div>';
  }

  html += '<div class="detail-section">';
  html += '<div class="detail-label">Arguments</div>';
  html += '<div class="detail-value args-view">' + escapeHtml(JSON.stringify(data.args, null, 2)) + '</div>';
  html += '</div>';

  html += '<div class="detail-section">';
  html += '<div class="detail-label">Output</div>';
  // Highlight background notifications in detail output
  let outputHtml = escapeHtml(data.output || "(empty)");
  outputHtml = outputHtml.replace(
    /\[后台任务 bg_(\d+) (完成|失败)\]/g,
    '<span style="color:var(--tool-background);font-weight:600">[后台任务 bg_$1 $2]</span>'
  );
  html += '<div class="detail-value">' + outputHtml + '</div>';
  html += '</div>';

  detailEl.innerHTML = html;
}

// ---- Todo ----
function updateTodo(items) {
  if (!items || !items.length) {
    todoListEl.innerHTML = '<div class="todo-empty">no tasks yet</div>';
    return;
  }

  const icons = { pending: "[ ]", in_progress: "[~]", completed: "[x]" };
  todoListEl.innerHTML = items.map((item, i) => {
    const icon = icons[item.status] || "[?]";
    const cls = item.status || "pending";
    return `<div class="todo-item ${cls}" style="animation-delay:${i * 40}ms">` +
      `<span class="icon">${icon}</span>` +
      `<span class="text">${escapeHtml(item.text)}</span>` +
    '</div>';
  }).join("");
}

// ---- Task (s07+) ----
function updateTodoText(text) {
  if (!text || text === "（无任务）") {
    todoListEl.innerHTML = '<div class="todo-empty">no tasks yet</div>';
    return;
  }

  const iconColors = {
    "[ ]": "todo-item pending",
    "[~]": "todo-item in_progress",
    "[x]": "todo-item completed",
  };

  const lines = text.split("\n");
  let html = "";

  for (const line of lines) {
    // Match task.py format: optional indent + #id + icon + text
    // e.g. "#1 [ ] 搭建 Web API" or "  #6 [~] 设计数据库 schema"
    const taskMatch = line.match(/^(\s*)#(\d+)\s+(\[[ x~?]\])\s+(.+)$/);
    if (taskMatch) {
      const indent = taskMatch[1].length;
      const num = taskMatch[2];
      const icon = taskMatch[3];
      const taskText = taskMatch[4];
      const cls = iconColors[icon] || "todo-item pending";
      const isChild = indent > 0;
      const childStyle = isChild ? 'padding-left:32px;font-size:12px;' : '';
      html += '<div class="' + cls + '" style="' + childStyle + '">' +
        '<span class="icon">' + escapeHtml(icon) + '</span>' +
        '<span class="text">' + escapeHtml(taskText) + '</span>' +
      '</div>';
      continue;
    }

    // Summary line: (X 待办, Y 进行中, ...)
    const summaryMatch = line.match(/^\(/);
    if (summaryMatch) {
      html += '<div style="padding:8px 16px 4px;font-family:var(--mono);font-size:11px;color:rgba(var(--paper-rgb),.35)">' + escapeHtml(line) + '</div>';
      continue;
    }

    // Fallback: plain text line
    if (line.trim()) {
      html += '<div style="padding:4px 16px;font-size:12px;color:rgba(var(--paper-rgb),.5)">' + escapeHtml(line) + '</div>';
    }
  }

  todoListEl.innerHTML = html || '<div class="todo-empty">no tasks yet</div>';
}

// ---- Status ----
function updateStatus() {
  statTurns.textContent = turnCount;
  statTools.textContent = toolCallCount;
  statusMsgs.textContent = msgCount + " msgs";
  statusToolCalls.textContent = toolCallCount + " tool calls";
}

// ---- Util ----
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n) + "..." : s;
}

// ---- Team (s09) ----
function renderTeam() {
  const names = Object.keys(teamState);
  if (names.length === 0) {
    teamListEl.innerHTML = '<div class="todo-empty">no teammates</div>';
    return;
  }
  teamListEl.innerHTML = names.map(name => {
    const t = teamState[name];
    const cls = t.status || "idle";
    const initials = name.slice(0, 2);
    return '<div class="team-card ' + cls + '">' +
      '<div class="team-avatar">' + escapeHtml(initials) + '</div>' +
      '<div class="team-info">' +
        '<div class="team-name">' + escapeHtml(name) + '</div>' +
        '<div class="team-role">' + escapeHtml(t.role || "") + '</div>' +
      '</div>' +
      '<div class="team-status-dot"></div>' +
    '</div>';
  }).join("");
}

function updateTeamFromStatus(output) {
  if (!output) return;
  // Parse: "  name（role）- status"
  const lines = output.split("\n");
  for (const line of lines) {
    const m = line.match(/^\s+(\S+)\uff08(.+?)\uff09\s*-\s*(\w+)/);
    if (m) {
      const name = m[1], role = m[2], status = m[3];
      if (name !== "lead") {
        teamState[name] = { role: role, status: status };
      }
    }
  }
  renderTeam();
}

// ---- Init ----
connect();
inputEl.focus();

// Fetch stages and build dropdown
fetch("/api/stages").then(r => r.json()).then(d => {
  d.stages.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.tag;
    stageSelect.appendChild(opt);
  });
  stageSelect.value = d.default;
}).catch(() => {});

stageSelect.addEventListener("change", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "switch_stage", stage: stageSelect.value }));
  }
});
</script>
